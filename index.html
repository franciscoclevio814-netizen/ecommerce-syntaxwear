<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Syntaxwear - Tênis e Sneakers Online</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./css/reset.css" >
  <link rel="stylesheet" href="./css/variables.css" >
  <link rel="stylesheet" href="./css/base.css" >
  <link rel="stylesheet" href="./css/layout.css" >
  <link rel="stylesheet" href="./css/componentes/header.css" >
    <link rel="stylesheet" href="./css/componentes/hero.css" >

</head>
<body>
  <header class="site-header">
    <h1 class="logo">
      <a href="/" title="Syntaxwear - Tênis e Sneakers Online">
        <img src="./images/logo/Logo.svg" alt="Syntaxwear - Tênis e Sneakers Online">
      </a>
    </h1>

    <nav class="nav-center" aria-label="Menu Principal">
      <ul>
        <li><a href="#masculino">Masculino</a></li>
        <li><a href="#feminino">Feminino</a></li>
        <li><a href="#outlet">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Menu de Acesso Rápido">
      <ul>
        <li><a href="#lojas">Nossas lojas</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li>
          <a href="#perfil" aria-label="Perfil">
            <img src="./images/icons/user.svg" alt="Perfil">
          </a>
        </li>
        <li>
          <a href="#ajuda" aria-label="Ajuda">
            <img src="./images/icons/help.svg" alt="Ajuda">
          </a>
        </li>
        <li>
          <a href="#carrinho" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Carrinho">
          </a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="hero-section">
        <div class="Overlay">
      <div class="hero-content">
        <span class="hero-subtitle">krypton One</span>
      <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
      <div class="hero-buttons">
        <a class="btn btn-outline" href="#">Ver modelo</a>
        <a class="btn btn-filled" href="#">Comprar</a>
      </div>
      </div>    
      </div>
        </section>

    <section class="product-gallery" id="masculino">
      <h3>Masculino</h3>
      <!-- Produtos masculinos aqui -->
    </section>

    <section class="product-gallery" id="feminino">
      <h3>Feminino</h3>
      <!-- Produtos femininos aqui -->
    </section>

    <section class="product-gallery" id="outlet">
      <h3>Outlet</h3>
      <!-- Produtos em promoção aqui -->
    </section>

    <section class="newsletter">
      <h3>Assine nossa Newsletter</h3>
      <p>Receba ofertas exclusivas e novidades em primeira mão.</p>
      <form action="#" method="post">
        <input type="email" name="email" placeholder="Digite seu email" required>
        <button type="submit">Assinar</button>
      </form>
    </section>
</body>
</html>
